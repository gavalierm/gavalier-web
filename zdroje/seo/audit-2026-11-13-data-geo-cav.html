*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {

body {
  font-family: 'Sora', system-ui, -apple-system, sans-serif;

a { color: inherit; text-decoration: none; }

:root {
  --blue: #00fff6;
  --yellow: #ffff00;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

.hero {
  position: relative;
  width: 100%;
  min-height: 100vh;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero__bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  filter: brightness(var(--brightness, 0.85));
  will-change: filter;
}

.hero--blue  .hero__bg { background-image: url('cavaleers-web-homepage-desktop-pic1.jpg'); }
.hero--yellow .hero__bg { background-image: url('cavaleers-web-homepage-desktop-pic2.jpg'); }

@media (max-width: 768px) {
  .hero--blue  .hero__bg { background-image: url('cavaleers-web-homepage-phone-pic1.jpg'); }
  .hero--yellow .hero__bg { background-image: url('cavaleers-web-homepage-phone-pic2.jpg'); }
}

.ring-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 65vw;
  height: 65vw;
  pointer-events: none;
  will-change: transform;
  transform:
    translate(-50%, -50%)
    scale(var(--scale, 0.5))
    rotate(var(--rotate, 0deg));
}

@media (max-width: 768px) {
  .ring-wrap {
    width: 80vh;
    height: 80vh;
    transform:
      translate(-50%, -50%)
      scale(var(--scale, 0.4))
      rotate(calc(-45deg + var(--rotate, 0deg)));
  }
}

.dot-anchor {
  position: absolute;
  width: 0;
  height: 0;
  will-change: transform;
  transform: translate(var(--dx, 0px), var(--dy, 0px));
}
.dot-anchor--tr { top: 4%; left: 96%; }
.dot-anchor--bl { top: 96%; left: 4%; }

.dot {
  position: absolute;
  top: 0;
  left: 0;
  border-radius: 50%;
  background: currentColor;
  filter: drop-shadow(0 0 20px currentColor);
  transform: translate(-50%, -50%);
  animation: pulse 2.6s ease-in-out infinite;
}
.dot--tr {
  width: 40px;
  height: 40px;
  background: transparent;
  border: 2px solid currentColor;
}
.dot--bl {
  width: 51px;
  height: 51px;
  animation-delay: 1.3s;
}

@keyframes pulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  50%      { transform: translate(-50%, -50%) scale(1.35); opacity: 0.7; }
}

.hero__content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 0 24px;
  max-width: 90vw;
  margin: 0 auto;
}
.hero__logo {
  display: block;
  width: clamp(160px, 20vw, 240px);
  height: auto;
  aspect-ratio: 1 / 1;
  margin: calc(-0.5 * clamp(160px, 20vw, 240px)) auto clamp(-14px, -0.6vw, -2px);
  position: relative;
  z-index: 1;
}
.hero__text {

}
.hero__text::before {
  content: '';

  -webkit-mask-image: radial-gradient(ellipse 70% 70% at center, #000 35%, transparent 75%);
          mask-image: radial-gradient(ellipse 70% 70% at center, #000 35%, transparent 75%);

.hero__title {

.btn {
  display: inline-flex;
  align-items: center;

.btn:hover { animation: btnWobble 1.1s ease-in-out forwards; }

@keyframes btnWobble {
  0%   { transform: scale(1, 1)         translateY(0); }
  18%  { transform: scale(1.04, 0.96)   translateY(-2px); }
  36%  { transform: scale(0.97, 1.03)   translateY(-5px); }
  54%  { transform: scale(1.025, 0.975) translateY(-3px); }
  72%  { transform: scale(0.99, 1.01)   translateY(-4px); }
  88%  { transform: scale(1.01, 0.99)   translateY(-3px); }
  100% { transform: scale(1, 1)         translateY(-3px); }
}

.hero--blue   { color: var(--blue); }
.hero--yellow { color: var(--yellow); }

.hero--blue   .hero__title em,

@media (prefers-reduced-motion: reduce) {

<script>
(function () {
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const mobileMQ = window.matchMedia('(max-width: 768px)');
  const sections = document.querySelectorAll('.hero');
  const anchors = document.querySelectorAll('.dot-anchor');
  const anchorState = new Map();
  anchors.forEach(a => anchorState.set(a, { dx: 0, dy: 0 }));

  let mouseX = -9999, mouseY = -9999;
  let mouseInside = false;
  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    mouseInside = true;
  });
  window.addEventListener('mouseleave', () => { mouseInside = false; });

  const DODGE_THRESHOLD = 140;
  const DODGE_MAX = 95;
  const LERP = 0.22;

  if (reduce) {
    sections.forEach(s => {
      s.style.setProperty('--brightness', '0.7');
      s.style.setProperty('--scale', '1');
      s.style.setProperty('--rotate', '0deg');
    });
    return;
  }

  function update() {
    const vh = window.innerHeight;
    const scaleDelta = mobileMQ.matches ? 0.85 : 1.2;
    const scaleStart = mobileMQ.matches ? 0.4 : 0.4;

    sections.forEach(section => {
      const rect = section.getBoundingClientRect();
      const denom = rect.height + vh;
      let p = 1 - (rect.bottom / denom);
      if (p < 0) p = 0;
      else if (p > 1) p = 1;

      const visibility = 1 - Math.abs(0.5 - p) * 2;
      const brightness = (0.25 + visibility * 0.65).toFixed(3);
      const scale = (scaleStart + p * scaleDelta).toFixed(3);
      const rotate = (p * 45).toFixed(2) + 'deg';

      section.style.setProperty('--brightness', brightness);
      section.style.setProperty('--scale', scale);
      section.style.setProperty('--rotate', rotate);
    });

    anchors.forEach(anchor => {
      const dot = anchor.firstElementChild;
      const r = dot.getBoundingClientRect();
      let targetX = 0, targetY = 0;

      if (mouseInside && r.width > 0) {
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const dx = mouseX - cx;
        const dy = mouseY - cy;
        const dist = Math.hypot(dx, dy);

        if (dist < DODGE_THRESHOLD && dist > 0) {
          const force = (1 - dist / DODGE_THRESHOLD) * DODGE_MAX;
          const pushX = (-dx / dist) * force;
          const pushY = (-dy / dist) * force;

          const section = anchor.closest('.hero');
          const parentScale = parseFloat(section.style.getPropertyValue('--scale')) || 1;
          const parentRot = parseFloat(section.style.getPropertyValue('--rotate')) || 0;
          const rad = parentRot * Math.PI / 180;
          const cos = Math.cos(rad);
          const sin = Math.sin(rad);

          targetX = (pushX * cos + pushY * sin) / parentScale;
          targetY = (-pushX * sin + pushY * cos) / parentScale;
        }
      }

      const s = anchorState.get(anchor);
      s.dx += (targetX - s.dx) * LERP;
      s.dy += (targetY - s.dy) * LERP;
      anchor.style.setProperty('--dx', s.dx.toFixed(1) + 'px');
      anchor.style.setProperty('--dy', s.dy.toFixed(1) + 'px');
    });

    requestAnimationFrame(update);
  }
  update();
})();
</script>
